<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>Feedback: Dental CAD</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%232f6fde' d='M9 3c-3.5 0-6 2.8-6 6.5 0 4 1.6 6.4 2.6 9.8C6.8 23.6 7.4 29 10 29c2.4 0 2.6-4.6 3.4-7 .5-1.4 1.5-2 2.6-2s2.1.6 2.6 2c.8 2.4 1 7 3.4 7 2.6 0 3.2-5.4 4.4-9.7 1-3.4 2.6-5.8 2.6-9.8C29 5.8 26.5 3 23 3c-2.6 0-4.4 1.6-7 1.6S11.6 3 9 3z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/landing/landing.css" />
    <link rel="stylesheet" href="/src/pages/pages.css" />
    <script type="module" src="/src/pages/feedback.ts"></script>
  </head>
  <body>
    <header class="nav">
      <div class="wrap nav-row">
        <a class="wordmark" href="../" aria-label="Dental CAD, home">Dental CAD</a>
      </div>
    </header>
    <main class="wrap page">
      <h1>Feedback</h1>
      <p class="lede">Dental CAD is a beta. Tell us what broke, what confused you, or what a case needed that it could not do.</p>
      <p class="page-email" data-needs-email>
        Email is the quickest way: <a data-contact-email data-subject="Dental CAD feedback"></a>
      </p>

      <form id="feedback-form" class="signup page-form" novalidate>
        <h2>Or send it here</h2>
        <div class="field">
          <label for="fb-message">What happened?</label>
          <textarea id="fb-message" name="message" rows="5" maxlength="2000" required></textarea>
        </div>
        <div class="field">
          <label for="fb-email">Your email <span class="label-hint">(optional, so we can reply)</span></label>
          <input id="fb-email" name="email" type="email" autocomplete="email" />
        </div>
        <div class="field field-submit">
          <button class="button button-primary" type="submit">Send feedback</button>
        </div>
        <p class="form-error" role="alert" hidden></p>
        <p class="form-ok" role="status" hidden>Thank you. It reached us.</p>
        <p class="form-note">Please do not include patient details. Beta: anonymised scans only.</p>
      </form>
      <p class="page-links"><a href="../privacy/">Privacy</a> · <a href="../">Back to the site</a></p>
    </main>
  </body>
</html>
