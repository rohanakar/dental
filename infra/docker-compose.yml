# Production stack for a single VM (OCI aarch64, 12 vCPU / 6 GB).
# Always run through the wrapper so the repo-root .env is used for both
# interpolation and container env, and BASE_PATH is derived from PUBLIC_URL:
#   ./infra/compose.sh up -d --build
# Default mode: our Caddy listens on plain HTTP at HTTP_BIND (127.0.0.1:8080)
# behind your existing HTTPS reverse proxy. TLS mode: see docker-compose.tls.yml.
name: dcad

services:
  proxy:
    build:
      context: ..
      dockerfile: infra/proxy.Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BASE_PATH: ${BASE_PATH:-}
    ports:
      - "${HTTP_BIND:-127.0.0.1:8080}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-dcad}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-dcad}
      BLOB_FS_ROOT: /data/blobs
      MIGRATIONS_DIR: /app/drizzle
    volumes:
      - blobs:/data/blobs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped

  db:
    image: postgres:17
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-dcad}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1536m
    restart: unless-stopped

volumes:
  pgdata:
  blobs:
  caddy_data:
  caddy_config:
