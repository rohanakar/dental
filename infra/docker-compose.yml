# Production stack for a single VM (OCI aarch64, 12 vCPU / 6 GB).
#   ./infra/compose.sh up -d --build
# Nginx Proxy Manager owns the domain and TLS. Our Caddy (proxy) joins NPM's
# Docker network (shared_net) as "dcad-proxy" and serves plain HTTP on :80; no host ports.
name: dcad

services:
  proxy:
    build:
      context: ..
      dockerfile: infra/proxy.Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    environment:
      BASE_PATH: ${BASE_PATH:-}
    networks:
      default:
      shared_net:
        aliases: [dcad-proxy]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-dcad}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-dcad}
      BLOB_FS_ROOT: /data/blobs
      MIGRATIONS_DIR: /app/drizzle
    volumes:
      - blobs:/data/blobs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped

  db:
    image: postgres:17
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-dcad}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1536m
    restart: unless-stopped

  # Nightly pg_dump + blob tarball into BACKUP_DIR on the host (see infra/backup/backup.sh).
  backup:
    image: postgres:17
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-dcad}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: ${POSTGRES_DB:-dcad}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-0}
    volumes:
      - ./backup:/backup:ro
      - blobs:/blobs:ro
      - ${BACKUP_DIR:-/var/backups/dcad}:/backups
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

networks:
  shared_net:
    external: true

volumes:
  pgdata:
  blobs:
  caddy_data:
  caddy_config:
